name: 테스트

# PR과 main 푸시마다 테스트와 워크플로 검사를 돌린다. 시크릿과 비공개 데이터를
# 쓰지 않으므로 포크에서 온 PR에서도 안전하다. 테스트는 임시 CSV로만 돈다.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "module*/requirements.txt"

      - name: 의존성 설치
        run: pip install -r module2_news_pipeline/requirements.txt -r module3_excel_generator/requirements.txt pytest

      - name: 테스트
        run: python3 -m pytest module2_news_pipeline/ module3_excel_generator/ -q

      - name: 워크플로 검사 (actionlint)
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color
