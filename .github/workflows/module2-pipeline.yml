name: 모듈2 - 뉴스 수집 파이프라인

# 주말·공휴일을 포함해 매일 01:15 KST에 자동 실행하고, GitHub Actions
# 탭의 "Run workflow"로도 수동 트리거할 수 있다. 매일 전일 뉴스를
# 빠짐없이 수집하고, 주말·공휴일치는 다음 영업일 검토 때 하나로 합친다.
# 스펙 NFR-1은 이 자동 스케줄에 맞춰 갱신했다.
# 이 워크플로우는 이 클라우드 세션과 달리 외부 인터넷(네이버 API)에
# 접속할 수 있는 GitHub Actions 러너에서 돈다.
#
# 이 저장소는 공개이고 데이터(법인·팀 매핑 CSV, 수집 결과)는 비공개 데이터
# 저장소에 있다. 데이터 저장소를 .data/에 받아 작업 폴더로 복사해 쓰고,
# 결과는 데이터 저장소에 커밋한다. 공개 로그에서 법인명은 가린다.
#
# 08:00이 아니라 01:15인 이유: 수집 대상은 실행 시각과 무관하게 항상
# "KST 기준 어제 하루"라, 몇 시에 돌든 결과는 같다. 반면 GitHub의
# schedule 트리거는 정각(0분)·UTC 자정 근처에 몰려 지연이 크다(실측
# 사례: 08:00 KST 목표가 09:39 KST에 실행됨). 08:00 KST는 23:00 UTC로
# 이 혼잡 시간대에 정확히 걸려 있어, 덜 몰리는 시간대(01:15 KST = 전날
# 16:15 UTC)로 옮겨 지연 가능성을 낮췄다.
on:
  workflow_dispatch:
    inputs:
      date_from:
        description: "수집 시작일 (YYYY-MM-DD). 비우면 어제(D-1)."
        required: false
        type: string
      date_to:
        description: "수집 종료일 (YYYY-MM-DD). 비우면 어제(D-1)."
        required: false
        type: string
      save_dropped:
        description: "키워드가 안 걸려 버린 관리 법인 기사를 파일로 남긴다(측정용)"
        required: false
        type: boolean
        default: false
  schedule:
    # cron은 UTC 기준. 01:15 KST(UTC+9)는 전날 16:15 UTC다.
    - cron: "15 16 * * *"

permissions:
  contents: read
  # 공개 저장소의 예약 실행은 60일 동안 저장소 활동이 없으면 꺼진다. 결과는
  # 데이터 저장소에 커밋하므로 이 저장소에는 활동이 없을 수 있어, 실행할
  # 때마다 이 워크플로를 다시 켠다(keepalive).
  actions: write

concurrency:
  group: module2-pipeline
  cancel-in-progress: false

env:
  # 비공개 데이터 저장소. 저장소 변수 DATA_REPO로 바꿀 수 있다.
  DATA_REPO: ${{ vars.DATA_REPO || 'YUJAEYUN/corp-issue' }}
  COMMIT_NAME: ${{ vars.COMMIT_NAME }}
  COMMIT_EMAIL: ${{ vars.COMMIT_EMAIL }}

jobs:
  collect:
    runs-on: ubuntu-latest
    # 평소 4~6분이다(2026-10-16~10-22 실측). 이보다 훨씬 길어지면 어딘가
    # 잘못된 것이므로 끊는다(2026-10-01에는 취소된 실행 하나가 3시간을 썼다).
    timeout-minutes: 60
    # 네이버 API 키를 "NAVER" environment에 등록했으므로, 이 job도 그
    # environment를 쓰겠다고 선언해야 시크릿이 주입된다 (repository
    # secret이 아니라 environment secret이라 선언 없이는 빈 값으로 온다).
    environment: NAVER
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 데이터 저장소 체크아웃 (비공개)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DATA_REPO }}
          token: ${{ secrets.DATA_REPO_TOKEN }}
          ref: main
          path: .data

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: module2_news_pipeline/requirements.txt

      - name: 데이터 가져오기
        run: |
          set -euo pipefail
          bash .github/scripts/data_repo.sh branch
          bash .github/scripts/data_repo.sh pull

      # 이후 모든 로그에서 법인명을 ***로 가린다. 데이터를 받은 직후, 무엇이든
      # 출력하기 전에 실행해야 한다.
      - name: 로그에서 법인명 가리기
        run: python3 .github/scripts/mask_corp_names.py

      - name: 의존성 설치
        run: pip install -r module2_news_pipeline/requirements.txt

      - name: 파이프라인 실행 (법인명 검색 + 키워드 검색 + 필터링)
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          DATE_FROM: ${{ inputs.date_from }}
          DATE_TO: ${{ inputs.date_to }}
          SAVE_DROPPED: ${{ inputs.save_dropped }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ "${SAVE_DROPPED:-false}" = "true" ]; then ARGS+=(--save-dropped); fi
          if [ -n "${DATE_FROM:-}" ]; then ARGS+=(--date-from "$DATE_FROM"); fi
          if [ -n "${DATE_TO:-}" ]; then ARGS+=(--date-to "$DATE_TO"); fi
          python3 module2_news_pipeline/pipeline.py "${ARGS[@]}"

      - name: 결과를 데이터 저장소에 커밋 & 푸시
        run: |
          set -euo pipefail
          echo "모듈2 뉴스 수집 결과 ($(TZ=Asia/Seoul date +%Y-%m-%d))" > "$RUNNER_TEMP/commit-msg.txt"
          bash .github/scripts/data_repo.sh push "$RUNNER_TEMP/commit-msg.txt" module2_news_pipeline/output

      - name: 예약 실행 유지 (keepalive)
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/module2-pipeline.yml/enable" \
            || echo "::warning::예약 실행을 다시 켜지 못했습니다. 60일 동안 저장소 활동이 없으면 예약 실행이 꺼집니다."
